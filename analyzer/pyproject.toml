[project]
name = "hoop-analyzer"
version = "0.2.0"
description = "録画 (delaycam) に対する骨格推定・ボール検出・トラッキング。バックエンド差し替え可能"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "av>=12",
    "rtmlib>=0.0.13",
    "scipy>=1.11",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# ByteTrack / OC-SORT を使う場合:  uv sync --extra trackers
trackers = ["trackers>=2.0"]
# MediaPipe Pose / Holistic を使う場合:  uv sync --extra mediapipe  (TFLite は mediapipe 内蔵。tensorflow は入らない)
mediapipe = ["mediapipe>=0.10"]

[project.scripts]
analyze = "hoop_analyzer.run:main"
bench = "hoop_analyzer.bench:main"
trackstats = "hoop_analyzer.trackstats:main"
live = "hoop_analyzer.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoop_analyzer"]
