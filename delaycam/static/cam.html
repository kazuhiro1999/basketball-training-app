<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DelayCam カメラ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 12px; padding-bottom: 40px; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  label { min-width: 84px; color: #aaa; font-size: 14px; }
  select { flex: 1; min-width: 120px; font-size: 16px; padding: 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; }
  button { font-size: 18px; padding: 14px 22px; border: 0; border-radius: 10px; color: #fff; background: #2a7; flex: 1; }
  button:disabled { background: #444; color: #999; }
  #stop { background: #c33; }
  #preview { width: 100%; max-height: 40vh; background: #000; border-radius: 8px; margin-top: 10px; object-fit: contain; }
  #status { font-size: 18px; margin: 10px 0 4px; font-weight: bold; }
  #stats, #log { font: 13px/1.5 ui-monospace, monospace; color: #9c9; white-space: pre-wrap; }
  #log { color: #888; max-height: 30vh; overflow: auto; }
  .ok { color: #6f6; } .ng { color: #f66; }
  .hint { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h1>DelayCam カメラ</h1>

<div class="row"><label>カメラ</label><select id="camera"><option value="">自動（背面）</option></select></div>
<div class="row"><label>解像度</label>
  <select id="res">
    <option value="640x360">640×360</option>
    <option value="1280x720" selected>1280×720</option>
    <option value="1920x1080">1920×1080</option>
  </select>
  <label>fps</label>
  <select id="fps"><option>30</option><option>60</option></select>
</div>
<div class="row"><label>ビットレート</label>
  <select id="bitrate">
    <option value="2">2 Mbps</option>
    <option value="4" selected>4 Mbps</option>
    <option value="6">6 Mbps</option>
    <option value="8">8 Mbps</option>
    <option value="12">12 Mbps</option>
  </select>
</div>
<div class="row"><label></label><label style="min-width:0"><input type="checkbox" id="test"> テストパターン（カメラを使わない）</label></div>

<div class="row">
  <button id="start">開始</button>
  <button id="stop" disabled>停止</button>
</div>

<div id="status">待機中</div>
<div id="stats"></div>
<video id="preview" muted playsinline autoplay></video>
<div class="hint">縦持ち・横持ちどちらでも撮れます（「開始」を押した時の向きで固定）。送信中は画面を消灯させないでください（自動でスリープ抑止を要求します）。充電しながらの使用を推奨。</div>
<div id="log"></div>

<script src="/static/cam.js"></script>
</body>
</html>
